# Compila un .ipa de iOS SIN FIRMAR en un Mac de GitHub, para instalarlo con
# Sideloadly (Windows) usando un Apple ID gratuito. Se lanza a mano desde Actions.
name: iOS sin firmar (Sideloadly)

on:
  workflow_dispatch:

concurrency:
  group: ios-unsigned
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: 1
      EXPO_NO_TELEMETRY: 1
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.EXPO_PUBLIC_MAPBOX_TOKEN }}
      MAPBOX_DOWNLOAD_TOKEN: ${{ secrets.MAPBOX_DOWNLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secretos
        run: |
          missing=0
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY EXPO_PUBLIC_MAPBOX_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Falta el secreto $name"; missing=1; fi
          done
          exit $missing

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Credenciales de descarga de Mapbox
        if: env.MAPBOX_DOWNLOAD_TOKEN != ''
        run: |
          printf "machine api.mapbox.com\nlogin mapbox\npassword %s\n" "$MAPBOX_DOWNLOAD_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

      - name: Generar proyecto nativo iOS
        run: npx expo prebuild --platform ios --clean

      - name: Compilar (Release, sin firma)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Roadly.xcworkspace \
            -scheme Roadly \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*Mapbox|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/Roadly.app

      - name: Empaquetar .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Roadly.app Payload/
          zip -qry Roadly-unsigned.ipa Payload
          ls -lh Roadly-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Roadly-unsigned-ipa
          path: Roadly-unsigned.ipa
          retention-days: 14

      - name: Log de xcodebuild si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log
          if-no-files-found: ignore
